# Essential reading for Agent Academy: papers, essays, guides and specs.
# URLs point to arXiv abstract pages or to the official page of the author, publisher or organization.

# ---------------------------------------------------------------- Foundations
- title: "Artificial Intelligence: A Modern Approach (4th edition)"
  authors: "Russell & Norvig"
  year: 2020
  url: "https://aima.cs.berkeley.edu/"
  category: "Foundations"
  summary: "The classic AI textbook; its rational-agent framing (percepts, actions, performance measures, environments) is still the clearest vocabulary for what an agent is."
  essential: false
  lesson: history-of-agents

- title: "Attention Is All You Need"
  authors: "Vaswani et al."
  year: 2017
  url: "https://arxiv.org/abs/1706.03762"
  category: "Foundations"
  summary: "Introduced the Transformer, the architecture underneath every modern LLM and therefore every LLM agent."
  essential: false
  lesson: llm-fundamentals

- title: "Language Models are Few-Shot Learners"
  authors: "Brown et al."
  year: 2020
  url: "https://arxiv.org/abs/2005.14165"
  category: "Foundations"
  summary: "GPT-3: showed that scale unlocks in-context learning, so a model can pick up new tasks from instructions and examples in the prompt alone."
  essential: false
  lesson: llm-fundamentals

- title: "The Bitter Lesson"
  authors: "Rich Sutton"
  year: 2019
  url: "http://www.incompleteideas.net/IncIdeas/BitterLesson.html"
  category: "Foundations"
  summary: "Short essay arguing that general methods that scale with compute beat hand-engineered knowledge; a useful lens for deciding how much structure to build into an agent harness."
  essential: false
  lesson: future-of-agents

- title: "A Survey on Large Language Model based Autonomous Agents"
  authors: "Wang et al."
  year: 2023
  url: "https://arxiv.org/abs/2308.11432"
  category: "Foundations"
  summary: "Broad survey organizing LLM agents into profile, memory, planning and action modules, with applications and evaluation methods."
  essential: false
  lesson: what-is-an-agent

# ------------------------------------------------------- Reasoning & Planning
- title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models"
  authors: "Wei et al."
  year: 2022
  url: "https://arxiv.org/abs/2201.11903"
  category: "Reasoning & Planning"
  summary: "Showed that prompting with step-by-step worked examples dramatically improves multi-step reasoning in large models."
  essential: true
  lesson: reasoning-and-planning

- title: "Large Language Models are Zero-Shot Reasoners"
  authors: "Kojima et al."
  year: 2022
  url: "https://arxiv.org/abs/2205.11916"
  category: "Reasoning & Planning"
  summary: "The \"Let's think step by step\" paper: chain-of-thought can be elicited without any examples."
  essential: false
  lesson: reasoning-and-planning

- title: "Self-Consistency Improves Chain of Thought Reasoning in Language Models"
  authors: "Wang et al."
  year: 2022
  url: "https://arxiv.org/abs/2203.11171"
  category: "Reasoning & Planning"
  summary: "Sample many reasoning paths and take the majority answer; an early, simple demonstration that extra test-time compute buys accuracy."
  essential: false
  lesson: reasoning-and-planning

- title: "Tree of Thoughts: Deliberate Problem Solving with Large Language Models"
  authors: "Yao et al."
  year: 2023
  url: "https://arxiv.org/abs/2305.10601"
  category: "Reasoning & Planning"
  summary: "Turns reasoning into search: the model proposes and evaluates partial thoughts, exploring and backtracking over a tree."
  essential: false
  lesson: reasoning-and-planning

- title: "ReAct: Synergizing Reasoning and Acting in Language Models"
  authors: "Yao et al."
  year: 2022
  url: "https://arxiv.org/abs/2210.03629"
  category: "Reasoning & Planning"
  summary: "Interleaves chain-of-thought with tool actions; the template for most modern agent loops."
  essential: true
  lesson: agent-architectures

- title: "Plan-and-Solve Prompting: Improving Zero-Shot Chain-of-Thought Reasoning by Large Language Models"
  authors: "Wang et al."
  year: 2023
  url: "https://arxiv.org/abs/2305.04091"
  category: "Reasoning & Planning"
  summary: "Ask the model to devise a plan first, then carry it out; reduces missing-step errors and foreshadows plan-and-execute agents."
  essential: false
  lesson: reasoning-and-planning

- title: "ReWOO: Decoupling Reasoning from Observations for Efficient Augmented Language Models"
  authors: "Xu et al."
  year: 2023
  url: "https://arxiv.org/abs/2305.18323"
  category: "Reasoning & Planning"
  summary: "Planner, worker and solver modules: plan all tool calls up front with placeholders, cutting the token cost of ReAct-style loops."
  essential: false
  lesson: agent-architectures

- title: "An LLM Compiler for Parallel Function Calling"
  authors: "Kim et al."
  year: 2023
  url: "https://arxiv.org/abs/2312.04511"
  category: "Reasoning & Planning"
  summary: "Plans tool calls as a dependency graph and executes independent calls in parallel, improving latency and cost over sequential ReAct."
  essential: false
  lesson: agent-architectures

- title: "Language Agent Tree Search Unifies Reasoning Acting and Planning in Language Models"
  authors: "Zhou et al."
  year: 2023
  url: "https://arxiv.org/abs/2310.04406"
  category: "Reasoning & Planning"
  summary: "LATS applies Monte Carlo tree search over agent trajectories, with the LLM serving as policy, value function and self-reflector."
  essential: false
  lesson: reasoning-and-planning

- title: "Reflexion: Language Agents with Verbal Reinforcement Learning"
  authors: "Shinn et al."
  year: 2023
  url: "https://arxiv.org/abs/2303.11366"
  category: "Reasoning & Planning"
  summary: "Agents write natural-language reflections on failed attempts and reuse them as memory, improving over trials without weight updates."
  essential: true
  lesson: agent-architectures

- title: "Self-Refine: Iterative Refinement with Self-Feedback"
  authors: "Madaan et al."
  year: 2023
  url: "https://arxiv.org/abs/2303.17651"
  category: "Reasoning & Planning"
  summary: "Generate, critique, revise with a single model; the simplest form of the evaluator-optimizer pattern."
  essential: false
  lesson: workflow-patterns

- title: "Large Language Models Cannot Self-Correct Reasoning Yet"
  authors: "Huang et al."
  year: 2023
  url: "https://arxiv.org/abs/2310.01798"
  category: "Reasoning & Planning"
  summary: "Important corrective: without external feedback, self-correction often fails to help and can hurt; ground critiques in tests and tool results."
  essential: false
  lesson: reasoning-and-planning

- title: "LLMs Can't Plan, But Can Help Planning in LLM-Modulo Frameworks"
  authors: "Kambhampati et al."
  year: 2024
  url: "https://arxiv.org/abs/2402.01817"
  category: "Reasoning & Planning"
  summary: "Position paper arguing LLMs should generate candidate plans that external verifiers check, rather than be trusted as planners on their own."
  essential: false
  lesson: reasoning-and-planning

- title: "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters"
  authors: "Snell et al."
  year: 2024
  url: "https://arxiv.org/abs/2408.03314"
  category: "Reasoning & Planning"
  summary: "Studies how to allocate inference compute (search against verifiers, sequential revision) and when it beats using a bigger model."
  essential: false
  lesson: reasoning-and-planning

# ---------------------------------------------------------- Tools & Actions
- title: "MRKL Systems: A modular, neuro-symbolic architecture that combines large language models, external knowledge sources and discrete reasoning"
  authors: "Karpas et al."
