- title: "Gorilla: Large Language Model Connected with Massive APIs"
  authors: "Patil et al."
  year: 2023
  url: "https://arxiv.org/abs/2305.15334"
  category: "Tools & Actions"
  summary: "Fine-tunes a model for accurate API calls with retrieval over documentation, reducing hallucinated arguments; origin of the Berkeley Function Calling Leaderboard."
