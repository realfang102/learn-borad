- title: "Executable Code Actions Elicit Better LLM Agents"
  authors: "Wang et al."
  year: 2024
  url: "https://arxiv.org/abs/2402.01030"
  category: "Tools & Actions"
  summary: "CodeAct: letting agents act by writing Python instead of JSON tool calls improves success rates and reduces the number of steps."
  essential: false
