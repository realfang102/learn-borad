- title: "Model Context Protocol (specification and documentation)"
  authors: "Anthropic and MCP contributors (now Agentic AI Foundation)"
  year: 2024
  url: "https://modelcontextprotocol.io"
  category: "Tools & Actions"
  summary: "The open standard for connecting agents to tools, resources and prompts via servers; read the architecture and security sections. The 2026-07-28 revision made the core protocol stateless (no initialize handshake or session ID) and moved tasks into an extension."
  essential: true
  lesson: protocols-mcp-a2a

- title: "Introducing the Model Context Protocol"
  authors: "Anthropic"
  year: 2024
  url: "https://www.anthropic.com/news/model-context-protocol"
  category: "Tools & Actions"
  summary: "The launch announcement explaining the M×N integration problem MCP was designed to solve."
  essential: false
  lesson: protocols-mcp-a2a

- title: "Announcing the Agent2Agent Protocol (A2A)"
  authors: "Google"
  year: 2025
  url: "https://developers.googleblog.com/en/a2a-a-new-era-of-agent-interoperability/"
  category: "Tools & Actions"
  summary: "Introduces A2A, an open protocol for agents from different vendors to discover each other via Agent Cards and collaborate on tasks; complements MCP. Donated to the Linux Foundation in June 2025, it reached v1.0 in March 2026 and joined the Agentic AI Foundation in August 2026."
  essential: false
  lesson: protocols-mcp-a2a

- title: "Linux Foundation Announces the Formation of the Agentic AI Foundation (AAIF)"
  authors: "Linux Foundation"
  year: 2025
  url: "https://www.linuxfoundation.org/press/linux-foundation-announces-the-formation-of-the-agentic-ai-foundation"
  category: "Tools & Actions"
  summary: "The December 2025 launch of a vendor-neutral home for agent standards, with MCP, goose and AGENTS.md as founding projects; A2A and Agent Skills joined in 2026."
  essential: false
  lesson: protocols-mcp-a2a

- title: "Code execution with MCP: Building more efficient agents"
  authors: "Anthropic"
  year: 2025
  url: "https://www.anthropic.com/engineering/code-execution-with-mcp"
  category: "Tools & Actions"
  summary: "Presenting MCP tools as code APIs that the agent calls from a sandbox, so tool definitions load on demand and bulky intermediate data never enters context."
  essential: false
  lesson: designing-tools

