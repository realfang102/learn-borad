- title: "ToolLLM: Facilitating Large Language Models to Master 16000+ Real-world APIs"
  authors: "Qin et al."
  year: 2023
  url: "https://arxiv.org/abs/2307.16789"
  category: "Tools & Actions"
  summary: "Builds ToolBench, a large instruction dataset over real REST APIs, and trains models to plan multi-step tool use with tree search."
  essential: false
